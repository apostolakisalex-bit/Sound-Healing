name: Preview candidate checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/unit_tests -q
        env:
          PYTHONPATH: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node scripts/test-load-races.cjs
      - run: pnpm export:web
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_BACKEND_URL: https://preview.invalid
